name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Re-runs the full CI suite so an APK is never published from a red commit.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Assemble release APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      # Generates the android/ project, which is not committed to the repository.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename the APK with the commit sha
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/armario-app-${GITHUB_SHA::7}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: armario-app-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
