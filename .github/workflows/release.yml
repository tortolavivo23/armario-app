name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Re-runs the full CI suite so an APK is never published from a red commit.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Assemble release APK
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create the release and its tag.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      # Generates the android/ project, which is not committed to the repository.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Only arm64-v8a. Building the other three ABIs meant compiling the native
      # code of six libraries four times over, which was three quarters of the
      # build, for architectures no phone released since about 2015 uses.
      - name: Assemble the release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          --build-cache --no-daemon --stacktrace

      - name: Read the app version
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Name the APK after the version
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/armario-app-v${{ steps.version.outputs.version }}.apk"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: armario-app-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # Publishes v<version> from app.json. Bumping that version is what makes a
      # new release appear; pushes that leave it untouched only get the artifact.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump expo.version in app.json to publish a new one."
            exit 0
          fi

          # A semver pre-release identifier (0.1.0-alpha.1) marks the release as
          # a pre-release so it is not offered as the latest stable download.
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          # --generate-notes builds the changelog from the commits since the
          # previous release on its own.
          gh release create "$TAG" "dist/armario-app-$TAG.apk" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
